<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enquiry - GreenLeaf Organic Market</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="images/greenleaf logo.jpg" alt="GreenLeaf Organic Market Logo" width="120">
    <h1>GreenLeaf Organic Market</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="enquiry.html">Enquiry</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Send Us an Enquiry</h2>
    <form>
      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name"><br><br>

      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email"><br><br>

      <label for="type">Enquiry Type:</label><br>
      <select id="type" name="type">
        <option value="product">Product Enquiry</option>
        <option value="volunteer">Volunteer</option>
        <option value="sponsor">Sponsorship</option>
      </select><br><br>

      <label for="message">Message:</label><br>
      <textarea id="message" name="message"></textarea><br><br>

      <input type="submit" value="Submit">
    </form>
  </main>

  <footer>
    <p>&copy; 2025 GreenLeaf Organic Market | Cape Town, South Africa</p>
  </footer>
</body>
</html>
